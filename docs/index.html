<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Phantom Demand Cost Calculator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Courier New',monospace;overflow:hidden;height:100vh}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;cursor:pointer}
.fade{transition:all 0.3s}
.bar-fill{transition:width 0.5s ease}
button{font-family:inherit;cursor:pointer;outline:none;transition:all 0.2s}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  // ── State ──
  let dark=true, lang="en", sups=6, hrs=4.5, sal=68000, inv=500000, days=250;

  // ── i18n ──
  const LANG={
    en:{
      badge:"Operations Cost Analysis · Gastonia NC",
      title:"Phantom Demand Cost Calculator",
      inputsTitle:"Input Variables",
      inputs:["Supervisors","Hours Lost / Day","Base Salary","Phantom Inventory","Working Days / Yr"],
      units:["","hrs","","","days"],
      outputTitle:"Annual Cost of Phantom Demand",
      outputSub:"fully loaded annual cost",
      stats:["Hourly rate (loaded)","Daily waste / supervisor","% of payroll wasted"],
      projection:"3-Year If Unremediated",
      breakdownTitle:"Cost Breakdown",
      barLabels:["Supervisor Time Waste","Inventory Holding Cost","Opportunity Cost"],
      barDescs:[
        function(s,h,d){return s+" supervisors × "+h+"h/day × "+d+" days"},
        function(i){return "25% carrying rate on $"+(i/1000).toFixed(0)+"K phantom WIP"},
        function(){return "$50K/yr per supervisor not on floor improvement"}
      ],
      tiles:["Per Hour","Per Day","Per Week","Per Supervisor / yr"],
      tileSubs:["phantom WO time","all supervisors","5-day week","salary waste only"],
      foot:"Assumptions:",
      footText:"Burden 1.30× base · Holding 25%/yr · Opp cost $50K/yr per supervisor · NC avg base $65–68K (ZipRecruiter 2025) · Gastonia metro adjustment applied",
      dark:"Dark",light:"Light"
    },
    es:{
      badge:"Análisis de Costos Operacionales · Gastonia NC",
      title:"Calculadora de Costos — Demanda Fantasma",
      inputsTitle:"Variables de Entrada",
      inputs:["Supervisores","Horas Perdidas / Día","Salario Base","Inventario Fantasma","Días Laborales / Año"],
      units:["","hrs","","","días"],
      outputTitle:"Costo Anual de Demanda Fantasma",
      outputSub:"costo anual completamente cargado",
      stats:["Tarifa por hora cargada","Pérdida diaria / supervisor","% de nómina desperdiciada"],
      projection:"Proyección 3 Años Sin Remedio",
      breakdownTitle:"Desglose de Costos",
      barLabels:["Pérdida de Tiempo Supervisor","Costo de Almacenamiento","Costo de Oportunidad"],
      barDescs:[
        function(s,h,d){return s+" supervisores × "+h+"h/día × "+d+" días"},
        function(i){return "25% costo anual sobre $"+(i/1000).toFixed(0)+"K WIP fantasma"},
        function(){return "$50K/año por supervisor no invertido en mejoras"}
      ],
      tiles:["Por Hora","Por Día","Por Semana","Por Supervisor / año"],
      tileSubs:["tiempo OT fantasma","todos los supervisores","semana de 5 días","solo pérdida salarial"],
      foot:"Supuestos:",
      footText:"Carga 1.30× salario base · Almacenamiento 25%/año · Oportunidad $50K/año · Promedio NC $65–68K (ZipRecruiter 2025) · Ajuste Gastonia aplicado",
      dark:"Oscuro",light:"Claro"
    }
  };

  function fc(n){return n>=1000000?"$"+(n/1000000).toFixed(2)+"M":"$"+Math.round(n).toLocaleString()}

  // ── Render ──
  function render(){
    var t=LANG[lang];
    var loaded=(sal*1.3)/2080;
    var daily=loaded*hrs;
    var supWaste=daily*days*sups;
    var holding=inv*0.25;
    var opp=sups*50000;
    var total=supWaste+holding+opp;
    var pct=(supWaste/(sal*1.3*sups))*100;

    var bars=[
      {label:t.barLabels[0],value:supWaste,color:"#E84855",desc:t.barDescs[0](sups,hrs,days)},
      {label:t.barLabels[1],value:holding,color:"#F4A261",desc:t.barDescs[1](inv)},
      {label:t.barLabels[2],value:opp,color:"#4A9FD4",desc:t.barDescs[2]()}
    ];
    var maxBar=Math.max(bars[0].value,bars[1].value,bars[2].value);

    var sliders=[
      {v:sups,key:"sups",min:1,max:20,step:1,disp:function(v){return v}},
      {v:hrs,key:"hrs",min:0.5,max:8,step:0.5,disp:function(v){return v}},
      {v:sal,key:"sal",min:45000,max:100000,step:1000,disp:function(v){return "$"+(v/1000).toFixed(0)+"K"}},
      {v:inv,key:"inv",min:50000,max:2000000,step:50000,disp:function(v){return "$"+(v/1000).toFixed(0)+"K"}},
      {v:days,key:"days",min:200,max:260,step:5,disp:function(v){return v}}
    ];

    var tiles=[
      {label:t.tiles[0],sub:t.tileSubs[0],val:fc(total/(days*8))},
      {label:t.tiles[1],sub:t.tileSubs[1],val:fc(total/days)},
      {label:t.tiles[2],sub:t.tileSubs[2],val:fc(total/(days/5))},
      {label:t.tiles[3],sub:t.tileSubs[3],val:fc(supWaste/sups)}
    ];

    // Theme colors
    var bg=dark?"#0D0D0D":"#F0EDE8";
    var surf=dark?"#1A1A1A":"#FFFFFF";
    var bdr=dark?"#383838":"#C8C4BE";
    var tP=dark?"#FFFFFF":"#111111";
    var tS=dark?"#CCCCCC":"#444444";
    var trk=dark?"#333333":"#DDDDDD";
    var s2=dark?"#222222":"#E5E1DC";
    var b2=dark?"#444444":"#B8B4AE";
    var acc="#E84855";
    var thumbColor=acc;

    function btnStyle(on,bg2,txt){
      return "padding:6px 14px;font-size:18px;font-weight:700;border-radius:5px;font-family:inherit;"+
        "background:"+(on?bg2:"transparent")+";color:"+(on?txt:tS)+";border:2px solid "+(on?bg2:bdr)+";";
    }
    var panelStyle="background:"+surf+";border:2px solid "+bdr+";border-radius:6px;box-sizing:border-box;transition:background 0.3s;";

    // Build slider HTML
    var slidersHTML="";
    for(var i=0;i<sliders.length;i++){
      var s=sliders[i];
      slidersHTML+='<div style="flex:1;display:flex;flex-direction:column;justify-content:center">'+
        '<div style="display:flex;justify-content:space-between;margin-bottom:3px">'+
        '<span style="font-size:18px;color:'+tS+'">'+t.inputs[i]+'</span>'+
        '<span style="font-size:20px;font-weight:700;color:'+tP+';white-space:nowrap">'+s.disp(s.v)+(t.units[i]?" "+t.units[i]:"")+'</span>'+
        '</div>'+
        '<input type="range" min="'+s.min+'" max="'+s.max+'" step="'+s.step+'" value="'+s.v+'" data-key="'+s.key+'"'+
        ' style="width:100%;accent-color:'+acc+';cursor:pointer"/>'+
        '</div>';
    }

    // Build tiles HTML
    var tilesHTML="";
    for(var i=0;i<tiles.length;i++){
      tilesHTML+='<div style="background:'+s2+';border:2px solid '+b2+';border-radius:5px;padding:8px 12px">'+
        '<div style="font-size:18px;font-weight:700;letter-spacing:0.08em;color:'+tS+';text-transform:uppercase;margin-bottom:2px">'+tiles[i].label+'</div>'+
        '<div style="font-size:24px;font-weight:700;color:'+tP+';letter-spacing:-0.02em">'+tiles[i].val+'</div>'+
        '<div style="font-size:18px;color:'+tS+'">'+tiles[i].sub+'</div>'+
        '</div>';
    }

    // Build bars HTML
    var barsHTML="";
    for(var i=0;i<bars.length;i++){
      var b=bars[i];
      var w=(b.value/maxBar)*100;
      barsHTML+='<div style="flex:1;display:flex;flex-direction:column;justify-content:center">'+
        '<div style="display:flex;justify-content:space-between;margin-bottom:5px;gap:12px">'+
        '<span style="font-size:20px;font-weight:600;color:'+tP+'">'+b.label+'</span>'+
        '<span style="font-size:22px;font-weight:700;color:'+tP+';white-space:nowrap">'+fc(b.value)+'</span>'+
        '</div>'+
        '<div style="height:18px;background:'+trk+';border-radius:4px;overflow:hidden;margin-bottom:4px">'+
        '<div class="bar-fill" style="height:100%;width:'+w+'%;background:'+b.color+';border-radius:4px"></div>'+
        '</div>'+
        '<div style="font-size:18px;color:'+tS+'">'+b.desc+'</div>'+
        '</div>';
    }

    // Stats
    var statVals=["$"+loaded.toFixed(2)+"/hr","$"+Math.round(daily).toLocaleString(),pct.toFixed(0)+"%"];
    var statsHTML="";
    for(var i=0;i<3;i++){
      var statColor=(i===2&&pct>50)?acc:tP;
      statsHTML+='<div style="display:flex;justify-content:space-between;gap:16px">'+
        '<span style="font-size:18px;color:'+tS+'">'+t.stats[i]+'</span>'+
        '<span style="font-size:20px;font-weight:700;color:'+statColor+';white-space:nowrap">'+statVals[i]+'</span>'+
        '</div>';
    }

    document.getElementById("app").innerHTML=
    '<div class="fade" style="background:'+bg+';height:100vh;overflow:hidden;font-family:\'Courier New\',monospace;color:'+tP+
    ';padding:12px 16px;box-sizing:border-box;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr 2fr;'+
    'grid-template-areas:\'header header\' \'left right\' \'footer footer\';gap:10px">'+

    // HEADER
    '<div style="grid-area:header;display:flex;justify-content:space-between;align-items:center">'+
      '<div>'+
        '<div style="font-size:18px;font-weight:700;letter-spacing:0.15em;color:'+acc+';text-transform:uppercase">'+t.badge+'</div>'+
        '<div style="font-size:clamp(20px,2.4vw,32px);font-weight:700;letter-spacing:-0.02em;color:'+tP+';line-height:1.1">'+t.title+'</div>'+
      '</div>'+
      '<div style="display:flex;gap:8px;align-items:center">'+
        '<button id="btn-en" style="'+btnStyle(lang==="en",acc,"#FFF")+'">EN</button>'+
        '<button id="btn-es" style="'+btnStyle(lang==="es",acc,"#FFF")+'">ES</button>'+
        '<div style="width:2px;height:30px;background:'+bdr+';margin:0 4px"></div>'+
        '<button id="btn-dark" style="'+btnStyle(dark,"#FFF","#0D0D0D")+'">◐ '+t.dark+'</button>'+
        '<button id="btn-light" style="'+btnStyle(!dark,"#111","#FFF")+'">○ '+t.light+'</button>'+
      '</div>'+
    '</div>'+

    // LEFT: Inputs
    '<div style="'+panelStyle+'grid-area:left;padding:14px 16px;display:flex;flex-direction:column">'+
      '<div style="font-size:18px;font-weight:700;letter-spacing:0.12em;color:'+tS+';text-transform:uppercase;margin-bottom:8px">'+t.inputsTitle+'</div>'+
      '<div style="display:flex;flex-direction:column;flex:1">'+slidersHTML+'</div>'+
    '</div>'+

    // RIGHT
    '<div style="grid-area:right;display:grid;grid-template-rows:auto 1fr;gap:10px">'+

      // TOP panel: Big number + tiles
      '<div style="'+panelStyle+'padding:14px 20px;display:grid;grid-template-columns:auto 1fr;gap:0 24px;align-items:start">'+
        '<div>'+
          '<div style="font-size:18px;font-weight:700;letter-spacing:0.12em;color:'+tS+';text-transform:uppercase;margin-bottom:2px">'+t.outputTitle+'</div>'+
          '<div style="font-size:clamp(40px,5vw,68px);font-weight:700;color:'+acc+';line-height:1;letter-spacing:-0.03em">'+fc(total)+'</div>'+
          '<div style="font-size:18px;color:'+tS+';margin-top:2px">'+t.outputSub+'</div>'+
          '<div style="margin-top:10px;display:flex;flex-direction:column;gap:5px">'+statsHTML+'</div>'+
        '</div>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
          tilesHTML+
          '<div style="grid-column:1/-1;background:'+s2+';border:2px solid '+b2+';border-radius:5px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center">'+
            '<div>'+
              '<div style="font-size:18px;font-weight:700;letter-spacing:0.08em;color:'+tS+';text-transform:uppercase">'+t.projection+'</div>'+
              '<div style="font-size:18px;color:'+tS+';margin-top:2px">if MRP is not remediated</div>'+
            '</div>'+
            '<div style="font-size:36px;font-weight:700;color:#F4A261;letter-spacing:-0.02em">'+fc(total*3)+'</div>'+
          '</div>'+
        '</div>'+
      '</div>'+

      // BOTTOM panel: Bars
      '<div style="'+panelStyle+'padding:14px 20px;display:flex;flex-direction:column">'+
        '<div style="font-size:18px;font-weight:700;letter-spacing:0.12em;color:'+tS+';text-transform:uppercase;margin-bottom:8px">'+t.breakdownTitle+'</div>'+
        '<div style="display:flex;flex-direction:column;flex:1">'+barsHTML+'</div>'+
      '</div>'+

    '</div>'+

    // FOOTER
    '<div style="grid-area:footer;border-top:1px solid '+b2+';padding-top:5px;font-size:18px;color:'+tS+';line-height:1.4">'+
      '<span style="font-weight:700;color:'+tP+'">'+t.foot+'</span> '+t.footText+
    '</div>'+

    '</div>';

    // ── Bind events ──
    document.getElementById("btn-en").onclick=function(){lang="en";render()};
    document.getElementById("btn-es").onclick=function(){lang="es";render()};
    document.getElementById("btn-dark").onclick=function(){dark=true;render()};
    document.getElementById("btn-light").onclick=function(){dark=false;render()};

    var ranges=document.querySelectorAll('input[type=range]');
    for(var i=0;i<ranges.length;i++){
      ranges[i].addEventListener("input",function(e){
        var k=e.target.getAttribute("data-key");
        var v=Number(e.target.value);
        if(k==="sups")sups=v;
        else if(k==="hrs")hrs=v;
        else if(k==="sal")sal=v;
        else if(k==="inv")inv=v;
        else if(k==="days")days=v;
        render();
      });
    }
  }

  render();
})();
</script>
</body>
</html>
